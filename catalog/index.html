<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BOT Lakehouse Data Catalog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2f5fd6;
    --bronze: #a9712f;
    --silver: #6b7280;
    --gold: #b8860b;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 28px 32px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  #generated { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 14px 32px; background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .tabs { display: flex; gap: 6px; }
  .tab {
    padding: 7px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .tab[data-layer="bronze"].active { background: var(--bronze); color: #fff; border-color: var(--bronze); }
  .tab[data-layer="silver"].active { background: var(--silver); color: #fff; border-color: var(--silver); }
  .tab[data-layer="gold"].active   { background: var(--gold);   color: #fff; border-color: var(--gold); }
  .tab .count { opacity: .75; font-weight: 400; }

  #search {
    margin-left: auto; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; width: 220px; max-width: 45vw;
  }

  main { padding: 20px 32px 48px; max-width: 1200px; margin: 0 auto; }
  .group-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 22px 0 10px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-head h3 { margin: 0; font-size: 15px; font-family: var(--mono); }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eef1f6; color: var(--muted);
    white-space: nowrap;
  }
  .desc { font-size: 13px; color: var(--text); margin: 8px 0 10px; line-height: 1.4; }
  .suggested {
    font-size: 12px; color: #1c4f8f; background: #eaf1fd; border-radius: 8px; padding: 8px 10px;
    margin-bottom: 10px; line-height: 1.4;
  }
  .suggested b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .stats strong { color: var(--text); font-weight: 600; }
  details { font-size: 12px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  table.cols { width: 100%; border-collapse: collapse; margin-top: 8px; font-family: var(--mono); font-size: 11.5px; }
  table.cols td { padding: 3px 4px; border-bottom: 1px solid #f0f1f3; }
  table.cols td.type { color: var(--muted); text-align: right; }
  .empty { color: var(--muted); font-size: 13px; padding: 30px 0; }
  .err { color: #b02a2a; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>BOT Lakehouse Data Catalog</h1>
  <p>What's available in Bronze, Silver, and Gold -- schema, coverage, and what each dataset is for.</p>
  <div id="generated"></div>
</header>

<div class="toolbar">
  <div class="tabs">
    <button class="tab" data-layer="bronze">Bronze <span class="count"></span></button>
    <button class="tab" data-layer="silver">Silver <span class="count"></span></button>
    <button class="tab" data-layer="gold">Gold <span class="count"></span></button>
  </div>
  <input id="search" type="text" placeholder="Filter by name...">
</div>

<main id="main"></main>

<script>
const LAYER_GROUP_LABELS = { bsis: "BSIS", master: "Master / reference data" };
let CATALOG = null;
let activeLayer = "bronze";

function fmtNum(n) {
  return n === null || n === undefined ? "--" : n.toLocaleString();
}

function cardHTML(layer, entry) {
  const cols = entry.columns.map(c =>
    `<tr><td>${c.name}</td><td class="type">${c.type}</td></tr>`
  ).join("");

  const dateRange = entry.date_range
    ? `${entry.date_range.min.slice(0,10)} &rarr; ${entry.date_range.max.slice(0,10)}`
    : "n/a";

  const suggested = entry.suggested_analysis
    ? `<div class="suggested"><b>Suggested analysis</b>${entry.suggested_analysis}</div>`
    : "";

  return `
    <div class="card">
      <div class="card-head">
        <h3>${entry.name}</h3>
        <span class="badge">${entry.format}${entry.cadence ? " &middot; " + entry.cadence : ""}</span>
      </div>
      <div class="desc">${entry.description || ""}</div>
      ${suggested}
      <div class="stats">
        <span><strong>${fmtNum(entry.row_count)}</strong> rows</span>
        <span><strong>${entry.columns.length}</strong> columns</span>
        ${entry.institution_count !== null ? `<span><strong>${entry.institution_count}</strong> institutions</span>` : ""}
        <span>coverage: <strong>${dateRange}</strong></span>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">
        last updated: ${entry.last_updated ? entry.last_updated.slice(0,19).replace("T"," ") : "n/a"}
      </div>
      <details>
        <summary>Schema (${entry.columns.length} columns)</summary>
        <table class="cols">${cols}</table>
      </details>
    </div>
  `;
}

function render() {
  const main = document.getElementById("main");
  const layerData = CATALOG.layers[activeLayer] || {};
  const filterText = document.getElementById("search").value.trim().toLowerCase();

  let html = "";
  for (const [group, entries] of Object.entries(layerData)) {
    const filtered = entries.filter(e => e.name.toLowerCase().includes(filterText));
    if (filtered.length === 0) continue;
    html += `<div class="group-title">${LAYER_GROUP_LABELS[group] || group} (${filtered.length})</div>`;
    html += `<div class="grid">${filtered.map(e => cardHTML(activeLayer, e)).join("")}</div>`;
  }
  main.innerHTML = html || `<div class="empty">No datasets match.</div>`;
}

function setTabCounts() {
  for (const tab of document.querySelectorAll(".tab")) {
    const layer = tab.dataset.layer;
    const groups = CATALOG.layers[layer] || {};
    const total = Object.values(groups).reduce((sum, arr) => sum + arr.length, 0);
    tab.querySelector(".count").textContent = `(${total})`;
  }
}

async function init() {
  const main = document.getElementById("main");
  try {
    const res = await fetch("catalog.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    CATALOG = await res.json();
  } catch (e) {
    main.innerHTML = `<div class="err">Could not load catalog.json (${e.message}).
      Run: docker compose exec spark spark-submit /opt/spark-jobs/catalog_builder.py</div>`;
    return;
  }

  document.getElementById("generated").textContent =
    "Last built: " + CATALOG.generated_at.slice(0, 19).replace("T", " ") + " UTC";

  setTabCounts();
  for (const tab of document.querySelectorAll(".tab")) {
    tab.addEventListener("click", () => {
      document.querySelector(".tab.active")?.classList.remove("active");
      tab.classList.add("active");
      activeLayer = tab.dataset.layer;
      render();
    });
  }
  document.querySelector(`.tab[data-layer="${activeLayer}"]`).classList.add("active");
  document.getElementById("search").addEventListener("input", render);

  render();
}

init();
</script>
</body>
</html>
