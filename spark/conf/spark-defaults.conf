# Delta/S3A jars are baked into $SPARK_HOME/jars at image build time (see
# Dockerfile) instead of resolved here via spark.jars.packages -- faster
# startup, and avoids a ClassNotFoundException under Spark Thrift Server
# (see Dockerfile comment for why).
spark.sql.extensions                    io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog         org.apache.spark.sql.delta.catalog.DeltaCatalog
