# Trino catalog for Gold (and Silver) Delta tables stored in MinIO.
#
# hive.metastore=file keeps this to a single new container: Trino's Delta Lake
# connector still needs *some* metastore to track schema->table->location
# mappings, but the file-based one just writes that as local JSON under
# hive.metastore.catalog.dir -- no separate Hive Metastore service/database
# needed for a POC. Tables are attached with `CALL delta.system.register_table`
# against existing Delta tables Spark already wrote; Trino never creates or
# manages the actual data files, only reads them.
connector.name=delta_lake
hive.metastore=file
# Must be a location Trino's filesystem layer actually has a factory for --
# plain file:// isn't registered by default, only s3/azure/gcs/hdfs -- so the
# file metastore's own catalog dir lives in MinIO too (note: Trino's native
# S3 filesystem uses the s3:// scheme, not s3a://, unlike Spark/Hadoop).
hive.metastore.catalog.dir=s3://lakehouse/_trino_metastore/

# Trino replaced the old hive.s3.* properties with this native S3 filesystem
# config (current as of Trino 483) -- hive.s3.* now errors as "not used".
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# Off by default; needed to attach Gold Delta tables that Spark already wrote
# without Trino re-defining their schema (Trino reads it from the Delta log).
delta.register-table-procedure.enabled=true
